function input(field,value,index,label,point=false,disabled=false){return `<input ${field==='name'?'class="name-inp" maxlength="40" autocomplete="off"':'type="text" inputmode="'+(point?'decimal':'numeric')+'"'} data-field="${field}" data-index="${index}" value="${esc(value??'')}" placeholder="${field==='name'?'İsim gir':'0'}" aria-label="${esc(label)}" ${disabled?'disabled':''}>`;}
function render(){const c=tabs[tab],b=boards[tab],admin=offline||isAdmin,points=tab!=='iksir';
$('#subtitle').textContent=c.description;$('#admin').textContent=isAdmin?'Yönetici çıkışı':'Yönetici girişi';
$('#tabs').innerHTML=Object.entries(tabs).map(([k,v])=>`<button type="button" role="tab" id="tab-${k}" aria-controls="resource-panel" aria-selected="${k===tab}" tabindex="${k===tab?0:-1}" class="tab-btn ${k===tab?'active':''}" data-tab="${k}">${v.icon} ${v.label}</button>`).join('');
$('#resource-panel').className='wrap resource-'+tab;$('#resource-panel').setAttribute('aria-labelledby','tab-'+tab);
$('#resource-panel').innerHTML=`<div class="status no-print ${loaded?'ok':''}" role="status"><span class="dot ${loaded?'ok':''}"></span><span id="connection">${offline?'HTML yedeği · Çevrimdışı hesaplama. Değişikliklerinizi HTML yedeği indirerek saklayın.':loaded?'Ortak tablo aktif: Değişiklikler herkesle otomatik senkronize olur.':'Ortak tabloya bağlanılıyor…'}</span><span class="sync-label" id="sync">${offline?'Çevrimdışı':loaded?'Güncel':''}</span></div><div id="error" class="error-banner no-print" hidden role="alert"></div><div class="toolbar no-print">${admin?'<button class="btn-clear" id="clear">♜ Temizle</button>':''}<button class="btn-print" id="print">▣ Yazdır / PDF</button><button class="btn-secondary" id="share">♧ Klan bağlantısı</button></div>${points&&admin?`<section class="points-panel" aria-label="${c.label} puan ayarları"><div class="points-title"><span class="section-icon">${c.icon}</span><div><h2>${c.label} puan ayarları</h2><p>${admin?'Oyun içi puanları yazın. Tüm üyeler için otomatik güncellenir.':'Adet puanlarını yalnızca klan yöneticisi belirler.'}</p></div><span class="permission-badge ${admin?'editable':''}">${admin?'Düzenleyebilirsiniz':'Yönetici ayarı'}</span></div><div class="points-fields"><label class="points-field"><span>${c.points}</span><div class="input-unit">${input('unitPoints',b.settings.unitPoints,'settings',c.points,true,!admin)}<span>puan</span></div></label>${c.secondaryPoints?`<label class="points-field"><span>${c.secondaryPoints}</span><div class="input-unit">${input('secondaryPoints',b.settings.secondaryPoints,'settings',c.secondaryPoints,true,!admin)}<span>puan</span></div></label>`:''}<div class="tab-summary"><span>${c.label} toplam puanı</span><strong id="summary">0 <small>puan</small></strong></div></div><div class="formula"><span>Hesaplama:</span> ${c.formula}</div>${tab==='binek'?'<p class="points-warning">Örnek: 1.000 kol ÷ 45 maliyet = 22 tam çağırma, 10 kalan kol. 22 × 125 = 2.750 puan. Çağırma maliyetini her oyuncunun satırına girin.</p>':''}<p id="missing-points" class="points-warning" hidden>Henüz tüm adet puanları belirlenmedi. Kaynaklarınızı girebilirsiniz; puan ayarlandığında sonuçlar otomatik hesaplanır.</p></section>`:''}${points?`<section class="top3 no-print" id="ranking" hidden><div class="top3-title">🏆 Sıralama <span>Yalnızca ${c.label.toLocaleLowerCase('tr-TR')} puanı</span></div><div class="top3-badges" id="ranks"></div></section>`:''}<div class="table-caption"><h2>${c.icon} ${c.label} tablosu</h2><span>50 oyuncu · ${offline?'HTML yedeği':'Otomatik kayıt'}</span></div><div class="table-scroll"><table><colgroup><col class="number-column"><col class="name-column"><col>${c.secondary?'<col>':''}${['binek','beceri'].includes(tab)?'<col>':''}${points?'<col class="score-column">':''}</colgroup><thead><tr><th scope="col">#</th><th scope="col">Oyun İçi Nick</th><th scope="col">${c.quantity}</th>${c.secondary?`<th scope="col">${c.secondary}</th>`:''}${['binek','beceri'].includes(tab)?`<th scope="col">${tab==='binek'?'Binek Çağırma Maliyeti':'Bilet Açma Maliyeti'}</th>`:''}${points?'<th scope="col">Toplam Puan</th>':''}</tr></thead><tbody>${b.rows.map((r,i)=>`<tr data-row="${i}"><td class="row-number">${i+1}</td><td>${input('name',r.name,i,`${i+1}. oyuncunun oyun içi nicki`)}</td><td>${input('quantity',r.quantity,i,`${i+1}. oyuncu: ${c.quantity}`)}</td>${c.secondary?`<td>${input('secondary',r.secondary,i,`${i+1}. oyuncu: ${c.secondary}`)}</td>`:''}${['binek','beceri'].includes(tab)?`<td>${input('cost',r.cost,i,`${i+1}. oyuncu: ${tab==='binek'?'Binek çağırma maliyeti':'Bilet açma maliyeti'}`)}</td>`:''}${points?'<td class="score-cell">—</td>':''}</tr>`).join('')}</tbody></table></div><div class="total-box">${c.label} ${points?'Toplamı':'Toplam Miktarı'}: <span id="total">0</span> ${points?'puan':'adet'}</div><div class="note"><span class="note-dot"></span>${offline?'Bu HTML dosyası tek başına hesaplama yapar. Yaptığınız değişiklikleri korumak için yeni bir HTML yedeği indirin.':'Aynı bağlantıyı açan tüm klan üyeleri ortak tabloyu görür. Değişiklikler otomatik kaydedilir. Oyuncu kaynaklarını girmek için kayıt veya giriş gerekmez.'}<span class="note-detail">Her sekmenin puanı ayrı hesaplanır; kaynaklar tek bir genel toplamda birleştirilmez.</span></div><footer>Bosskurt <span>Forge Master · Klan kaynak takibi</span></footer>`;
recalculate(); if(queue.length)$('#sync').textContent=failed?'Kaydedilmedi':'Kaydediliyor…';
$('#print').onclick=()=>window.print();$('#share').onclick=async()=>{try{await navigator.clipboard.writeText(location.origin+'/');toast('Klan bağlantısı kopyalandı.')}catch{toast('Klan bağlantısı: '+location.origin+'/')}};$('#admin').onclick=showAdmin;if($('#clear'))$('#clear').onclick=()=>{if(offline){showDialog('Tabloyu temizle',`${c.label} sekmesindeki oyuncu verileri silinecek.`,async()=>{boards[tab].rows=blank().rows;render()});return;}showDialog('Tabloyu temizle',`${c.label} sekmesindeki 50 oyuncunun verileri tüm klan üyeleri için silinecek.`,async()=>{const key=tab,changes=[];boards[key].rows.forEach((r,i)=>['name','quantity','secondary','cost'].forEach(f=>{if(r[f]!==null&&r[f]!==undefined&&r[f]!=='')changes.push({tab:key,kind:'row',index:i,field:f,value:f==='name'?'':null})}));boards[key].rows=blank().rows;failed=false;queue.push(...changes);render();flush();});};
}
function recalculate(){const b=boards[tab],scores=b.rows.map(r=>score(r)),total=tab==='iksir'?b.rows.reduce((n,r)=>n+(r.quantity||0),0):scores.reduce((a,v)=>a+v,0);$('#total').textContent=fmt(total);if($('#summary')){$('#summary').innerHTML=fmt(total)+' <small>puan</small>';$('#missing-points').hidden=b.settings.unitPoints!==null&&(!tabs[tab].secondaryPoints||b.settings.secondaryPoints!==null);}
b.rows.forEach((r,i)=>{const tr=$(`[data-row="${i}"]`);if(tr.querySelector('.score-cell'))tr.querySelector('.score-cell').textContent=scores[i]>0?fmt(scores[i]):'—';const costInp=tr.querySelector('[data-field="cost"]');if(costInp)costInp.setAttribute('aria-invalid',r.quantity&&!r.cost?'true':'false');});
if($('#ranking')){const ranked=b.rows.map((r,i)=>({r,i,s:scores[i]})).filter(x=>x.r.name||x.s>0).sort((a,b)=>b.s-a.s||a.i-b.i).slice(0,3);$('#ranking').hidden=!ranked.length;$('#ranks').innerHTML=ranked.map((x,i)=>`<div class="badge rank-${i}">${['🥇','🥈','🥉'][i]} ${esc(x.r.name||'#'+(x.i+1))} — ${fmt(x.s)} puan</div>`).join('');}}
async function api(key,options={}){const res=await fetch('/api/board?tab='+key,{...options,cache:'no-store',headers:{'Content-Type':'application/json'}});let data;try{data=await res.json()}catch{throw Error('Sunucudan yanıt alınamadı.')}if(!res.ok)throw Error(data.error||'İşlem tamamlanamadı.');return data;}
function error(message){$('#error').hidden=false;$('#error').innerHTML=esc(message)+' <button id="retry">Tekrar kaydet</button>';$('#retry').onclick=()=>{failed=false;flush();refresh()};}
async function refresh(){if(offline||queue.length||saving||document.activeElement?.matches('#resource-panel input'))return;const key=tab;try{const data=await api(key);boards[key]=data;if(tab===key){loaded=true;render()}}catch(e){if(tab===key)error(e.message)}}
async function flush(){if(offline||saving||failed)return;saving=true;try{while(queue.length){const item=queue[0];await api(item.tab,{method:'PATCH',body:JSON.stringify(item)});queue.shift();}$('#sync').textContent='Güncel';$('#error').hidden=true;}catch(e){failed=true;$('#sync').textContent='Kaydedilmedi';error(e.message+' Değişiklikler bu sayfada korunuyor.');}finally{saving=false;}}
document.addEventListener('input',e=>{const el=e.target;if(!el.matches('input[data-field]'))return;const field=el.dataset.field,index=el.dataset.index,settings=index==='settings';let value=el.value;if(field!=='name'){const valid=value===''||(/^\d+(?:[.,]\d{1,2})?$/.test(value)&&Number.isFinite(Number(value.replace(',','.')))&&Number(value.replace(',','.'))<=(settings?1e6:1e8)&&(settings||Number.isInteger(Number(value.replace(',','.'))))&&(field!=='cost'||Number(value)>0));el.setAttribute('aria-invalid',String(!valid));el.classList.toggle('invalid-input',!valid);if(!valid)return;value=value===''?null:Number(value.replace(',','.'));}if(settings)boards[tab].settings[field]=value;else boards[tab].rows[Number(index)][field]=value;recalculate();if(offline)return;const change={tab,kind:settings?'settings':'row',index:settings?undefined:Number(index),field,value};queue.push(change);$('#sync').textContent='Kaydediliyor…';flush();});
document.addEventListener('click',e=>{const button=e.target.closest('[data-tab]');if(button){tab=button.dataset.tab;render();refresh();}});
$('#tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const keys=Object.keys(tabs),i=keys.indexOf(tab);tab=keys[e.key==='Home'?0:e.key==='End'?keys.length-1:(i+(e.key==='ArrowRight'?1:-1)+keys.length)%keys.length];render();$('#tab-'+tab).focus();refresh();});
window.addEventListener('beforeunload',e=>{if(queue.length){e.preventDefault();e.returnValue='';}});
function toast(message){const box=$('#toast');box.textContent=message;box.hidden=false;setTimeout(()=>box.hidden=true,4500);}
function showDialog(title,text,action){const d=$('#dialog');d.innerHTML=`<button class="modal-close" aria-label="Kapat">×</button><h2>${esc(title)}</h2><p>${esc(text)}</p><p class="warning-text">Bu işlem geri alınamaz.</p><div class="modal-actions"><button class="btn-secondary" id="cancel">Vazgeç</button><button class="btn-clear" id="confirm">Bu sekmeyi temizle</button></div><p id="dialog-error" role="alert"></p>`;d.querySelector('.modal-close').onclick=()=>d.close();$('#cancel').onclick=()=>d.close();$('#confirm').onclick=async()=>{try{$('#confirm').disabled=true;await action();d.close()}catch(e){$('#dialog-error').textContent=e.message;$('#confirm').disabled=false}};d.showModal();}
const ADMINS=[{user:'uchihamatrax',pass:'Damacana63'},{user:'Bosskurt',pass:'forgemaster'}];
function showAdmin(){
if(isAdmin){isAdmin=false;render();toast('Yönetici çıkışı yapıldı.');return;}
const d=$('#dialog');
d.innerHTML=`<button class="modal-close" aria-label="Kapat">×</button><h2>Yönetici girişi</h2><form id="auth"><label>Kullanıcı adı<input id="auth-user" autocomplete="username" required></label><label>Şifre<input type="password" id="auth-pass" autocomplete="current-password" required></label><div class="modal-actions"><button class="btn-print" type="submit">Giriş yap</button></div></form><p id="auth-message" role="alert"></p>`;
d.querySelector('.modal-close').onclick=()=>d.close();
$('#auth').onsubmit=e=>{e.preventDefault();const u=$('#auth-user').value.trim().toLowerCase(),p=$('#auth-pass').value;if(ADMINS.some(a=>a.user.toLowerCase()===u&&a.pass===p)){isAdmin=true;d.close();render();toast('Yönetici girişi yapıldı.');}else{$('#auth-message').textContent='Kullanıcı adı veya şifre hatalı.';}};
d.showModal();
}

render();refresh();setInterval(refresh,5000);
</script></body></html>
